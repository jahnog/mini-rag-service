# Ordered guardrail list the chat log shows.
# enforce: false on one rail logs a block as pass with would_block, and does not
# apply that rail's patch. normalize still applies its text cleanup.
# This is the only rail-by-rail list. The Python modules point here.
version: 3
enforce: true
rails:
  # Block a question over the character cap, before search.
  - { id: length,            stage: input,    enabled: true, enforce: true }
  # Fold unicode and strip invisible characters. This cleanup always applies.
  - { id: normalize,         stage: input,    enabled: true, enforce: true }
  # Block an API-key shape on the question.
  - { id: secrets,           stage: input,    enabled: true, enforce: true }
  # Block "should I buy dollars". A regulatory "shall" in a circular is not advice.
  - { id: no-advice,         stage: input,    enabled: true, enforce: true }
  # Block jailbreak phrasing ("ignore your instructions") on the question.
  - { id: injection,         stage: input,    enabled: true, enforce: true, params: { backend: regex } }
  # Block a question that is not about BCRA CAMEX.
  - { id: scope,             stage: input,    enabled: true, enforce: true }
  # Drop a retrieved passage that itself matches the jailbreak regex.
  - { id: chunk-injection,   stage: retrieve, enabled: true, enforce: true, params: { backend: regex } }
  # Strip role markers from a passage. Drop the passage if nothing remains.
  - { id: chunk-hygiene,     stage: retrieve, enabled: true, enforce: true }
  # Keep passages until max_context_chars. Extra tail passages are a redact, not a block.
  - { id: context-budget,    stage: retrieve, enabled: true, enforce: true }
  # Require a quote from this turn's passages. A near-match can be adjusted.
  # No usable citation hides the draft and abstains.
  - { id: cite-or-abstain,   stage: output,   enabled: true, enforce: true }
  # Rewrite an unqualified "vigente hoy" so the answer names the dump date.
  - { id: freeze-honesty,    stage: output,   enabled: true, enforce: true }
  # Block investment advice in the answer, unless the words are a quote from this turn.
  - { id: no-advice-output,  stage: output,   enabled: true, enforce: true }
  # Block an API-key shape in the answer.
  - { id: secrets-output,    stage: output,   enabled: true, enforce: true }
  # Block if the answer contains the passage fence or a system-prompt sentence.
  - { id: prompt-leak,       stage: output,   enabled: true, enforce: true }
  # Redact ANSI escapes and tool-call tags. This one does not block.
  - { id: unsafe-output,     stage: output,   enabled: true, enforce: true }
  # Redact HTML and unsafe links. A clean answer still passes.
  - { id: markdown-sanitize, stage: output,   enabled: true, enforce: true }
