[project]
name = "bcra-rag"
version = "0.6.1"
description = "BCRA CAMEX mini-RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcra_rag"]

[tool.hatch.build.targets.wheel.force-include]
"src/bcra_rag/ui/observatory.css" = "bcra_rag/ui/observatory.css"

[project.optional-dependencies]
l1 = ["ragas"]

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bcra_rag"]

[[tool.mypy.overrides]]
module = ["chromadb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gradio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bcra_rag.ui.gradio_app"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live BCRA PDF download; requires --run-integration",
    "bdd: pytest-bdd scenarios",
]

[tool.coverage.report]
fail_under = 80
