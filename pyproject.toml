[project]
name = "bcra-rag"
version = "0.9.2"
description = "BCRA CAMEX mini-RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.5.9",
  "fastapi>=0.115.0",
  "gradio>=5.0.0",
  "httpx>=0.28.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "structlog>=24.0.0",
  "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcra_rag"]

[tool.hatch.build.targets.wheel.force-include]
"src/bcra_rag/ui/apple-touch-icon.png" = "bcra_rag/ui/apple-touch-icon.png"
"src/bcra_rag/ui/favicon.ico" = "bcra_rag/ui/favicon.ico"
"src/bcra_rag/ui/weblab.css" = "bcra_rag/ui/weblab.css"
"src/bcra_rag/ui/observatory.css" = "bcra_rag/ui/observatory.css"
"src/bcra_rag/ui/favicon.svg" = "bcra_rag/ui/favicon.svg"
"src/bcra_rag/ui/og.png" = "bcra_rag/ui/og.png"
"src/bcra_rag/ui/js/auth_request.js" = "bcra_rag/ui/js/auth_request.js"
"src/bcra_rag/ui/js/auth_verify.js" = "bcra_rag/ui/js/auth_verify.js"
"src/bcra_rag/ui/js/auth_logout.js" = "bcra_rag/ui/js/auth_logout.js"
"src/bcra_rag/guardrails/policy.yaml" = "bcra_rag/guardrails/policy.yaml"

[dependency-groups]
dev = [
  "mypy>=1.0.0",
  "playwright>=1.62.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-bdd>=8.0.0",
  "pytest-cov>=5.0.0",
  "respx>=0.22.0",
  "rich>=13.0.0",
  "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

# Chroma FastAPI-server CVEs; we only use PersistentClient (RustBindingsAPI).
# Re-audit when a patched release exists.
[tool.uv.audit]
ignore-until-fixed = [
  "GHSA-f4j7-r4q5-qw2c",
  "GHSA-36p7-vc44-83pf",
  "GHSA-2wm9-hf6c-p5cr",
  "GHSA-xph7-9rjv-w5fr",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP",
  # Simplicity gates (see AGENTS.md "Simplicity").
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  "BLE", "S110", "SIM", "ARG", "ANN401", "PGH003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 40
max-branches = 10
max-returns = 5

[tool.ruff.lint.per-file-ignores]
# Tests, scripts and evals are not held to the simplicity gates.
"tests/**" = ["C901", "PLR", "BLE", "S110", "SIM", "ARG", "ANN401", "PGH003"]
"scripts/**" = ["C901", "PLR", "BLE", "S110", "SIM", "ARG", "ANN401", "PGH003"]
"evals/**" = ["C901", "PLR", "BLE", "S110", "SIM", "ARG", "ANN401", "PGH003"]
# Ratchet: existing offenders only. Remove an entry when its file is fixed; never add one.
"src/bcra_rag/adapters/catalog_bcra.py" = ["PLR0911"]
"src/bcra_rag/adapters/embeddings.py" = ["ANN401", "PLR0913"]
"src/bcra_rag/adapters/index_chroma.py" = ["ANN401", "C901", "PLR0911", "PLR0912", "PLR0915"]
"src/bcra_rag/adapters/llm_openai.py" = ["ANN401", "C901"]
"src/bcra_rag/api/handle.py" = ["PLR0913"]
"src/bcra_rag/api/routes.py" = ["PLR0913"]
"src/bcra_rag/auth/cookies.py" = ["PLR0911"]
"src/bcra_rag/auth/mail_copy.py" = ["E501"]
"src/bcra_rag/auth/pages.py" = ["E501"]
"src/bcra_rag/auth/routes.py" = ["C901", "PLR0913", "PLR0915"]
"src/bcra_rag/composition.py" = ["PLR0913"]
"src/bcra_rag/domain/meta_filters.py" = ["PLR0911"]
"src/bcra_rag/domain/router.py" = ["PLR0911"]
"src/bcra_rag/evals/use_cases/run_generation.py" = ["PLR0913"]
"src/bcra_rag/evals/use_cases/run_l1.py" = ["ANN401", "PLR0913"]
"src/bcra_rag/ui/config.py" = ["PLR0911"]
"src/bcra_rag/ui/gradio_app.py" = ["PLR0913"]
"src/bcra_rag/ui/inspector_state.py" = ["ANN401"]
"src/bcra_rag/ui/mount.py" = ["ANN401"]
"src/bcra_rag/ui/turn_service.py" = ["PLR0913"]
"src/bcra_rag/ui/turn_stream.py" = ["PLR0913"]
"src/bcra_rag/use_cases/ingest_corpus.py" = ["PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bcra_rag"]

[[tool.mypy.overrides]]
module = ["chromadb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gradio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bcra_rag.ui.gradio_app"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: live BCRA PDF download; requires --run-integration",
  "bdd: pytest-bdd scenarios",
  "live_server: live acceptance against a running local process; requires --run-live-server",
  "live_http: live HTTP scenarios",
  "live_ui: live Playwright observatory scenarios",
  "prod_smoke: production HTTP smoke against a public origin; requires --run-prod-smoke",
]

[tool.coverage.report]
fail_under = 80
